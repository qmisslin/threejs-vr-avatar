<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="data:,">
        <title>Avatar IK POC</title>
        <style>
            * {
                box-sizing: border-box;
            }

            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #202020;
                color: #ddd;
                font: 13px Arial, sans-serif;
            }

            #app {
                display: flex;
                width: 100%;
                height: 100%;
            }

            #sidebar {
                width: 320px;
                min-width: 320px;
                height: 100%;
                padding: 16px;
                overflow-y: auto;
                background: #181818;
                border-right: 1px solid #383838;
            }

            #viewport {
                flex: 1;
                min-width: 0;
                height: 100%;
                overflow: hidden;
            }

            #viewport canvas {
                display: block;
            }

            section {
                padding-bottom: 16px;
                margin-bottom: 16px;
                border-bottom: 1px solid #383838;
            }

            section:last-child {
                border-bottom: none;
            }

            h2 {
                margin: 0 0 14px;
                font-size: 14px;
                font-weight: 600;
            }

            .checkbox-field {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 10px;
                cursor: pointer;
            }

            .checkbox-field input {
                margin: 0;
            }

            .field-group {
                margin-bottom: 14px;
            }

            .field-title {
                display: block;
                margin-bottom: 7px;
                color: #aaa;
                font-size: 12px;
            }

            .vector-inputs {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 8px;
            }

            .vector-inputs.single {
                grid-template-columns: minmax(0, 1fr);
                max-width: 92px;
            }

            .axis-field {
                display: flex;
                flex-direction: column;
                gap: 4px;
                min-width: 0;
            }

            .axis-label {
                font-size: 11px;
                color: #888;
                text-transform: uppercase;
            }

            .axis-field input,
            .animation-select,
            .animation-button {
                width: 100%;
                min-width: 0;
                padding: 6px;
                background: #282828;
                border: 1px solid #454545;
                border-radius: 3px;
                color: #eee;
                font: inherit;
            }

            .axis-field input:focus,
            .animation-select:focus,
            .animation-button:focus {
                outline: none;
                border-color: #888;
            }

            .animation-row {
                display: grid;
                grid-template-columns: minmax(0, 1fr) 80px;
                gap: 8px;
            }

            .animation-button {
                cursor: pointer;
            }

            .animation-button:hover {
                background: #363636;
            }
        </style>
        <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
    </head>

    <body>
        <div id="app">
            <aside id="sidebar">
                <div id="controls"></div>
            </aside>
            <main id="viewport"></main>
        </div>
        <script type="module">
            import { Scene } from './scene.js';

            new Scene().start().catch(console.error);
        </script>
    </body>

</html>
