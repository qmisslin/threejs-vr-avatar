<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Avatar Loader</title>
        <link rel="stylesheet" href="./style.css">
    </head>

    <body class="view-body">
        <main id="viewport" class="viewport">
            <canvas id="scene-canvas" aria-label="3D avatar viewport"></canvas>
        </main>

        <div id="status" class="status-message" role="status" aria-live="polite" hidden></div>

        <div class="toolbar-row">
            <div class="floating-toolbar">
                <button id="load-fbx" class="primary" type="button" title="Import FBX">
                    <span class="icon icon-upload"></span>
                    <span>Load FBX</span>
                </button>

                <button id="open-glb" type="button" title="Open GLB">
                    <span class="icon icon-open"></span>
                    <span>Open GLB</span>
                </button>

                <button id="reset-scene" type="button" title="Reset scene" aria-label="Reset scene">
                    <span class="icon icon-reset"></span>
                </button>

                <input id="fbx-input" type="file" accept=".fbx" multiple hidden>
                <input id="glb-input" type="file" accept=".glb" hidden>
            </div>

            <div id="animation-toolbar" class="floating-toolbar animation-toolbar" hidden>
                <div class="select-wrapper">
                    <select id="animation-select" aria-label="Current animation"></select>
                    <span class="icon icon-select" aria-hidden="true"></span>
                </div>

                <button id="toggle-animation" class="icon-button" type="button" aria-label="Pause animation"
                    title="Play / Pause">
                    <span id="animation-icon" class="icon icon-pause"></span>
                </button>
            </div>
        </div>

        <script type="module" src="./views/loader.js"></script>
    </body>

</html>
